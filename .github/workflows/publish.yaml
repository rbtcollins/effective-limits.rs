name: Publish to crates.io

on:
  push:
    branches: [master]

# Publishes when the version in Cargo.toml is not yet on crates.io, then
# tags the commit as v<version>. Authentication uses crates.io Trusted
# Publishing (GitHub OIDC), so no long-lived token is stored.

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: cargo

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine whether this version is already published
        id: version
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "effective-limits") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Sparse index entry for the crate: one JSON object per published version.
          if curl -sSf https://index.crates.io/ef/fe/effective-limits \
             | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
            echo "effective-limits $version is already on crates.io; nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "effective-limits $version is not on crates.io; publishing"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        if: steps.version.outputs.new == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        run: |
          set -eu
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
